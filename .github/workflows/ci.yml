name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      selenium:
        image: selenium/standalone-chrome:127.0
        options: >-
          --network=host
          --health-cmd="curl -f http://localhost:4444/wd/hub/status || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, pdo_mysql, dom, curl, zip
          coverage: xdebug

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Build frontend assets
        run: npm ci && npm run build

      - name: Setup environment
        run: |
          cp .env.ci .env
          php artisan key:generate

      - name: Setup Dusk Chrome Driver
        run: php artisan dusk:chrome-driver --detect

      - name: Run Unit and Feature Tests with Coverage
        run: php artisan test --testsuite=Unit,Feature --coverage-clover=storage/coverage/clover.xml

      - name: Setup CI Dusk environment (dedicated mysql `testing` DB)
        run: |
          cp .env.dusk.ci .env
          php artisan config:clear

      - name: Wait for MySQL testing database
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -P 3306 -u sail --password=password --silent && break
            sleep 1
          done

      - name: Start Laravel Application Server
        run: php artisan serve --port=8000 &

      - name: Run Dusk Browser Tests
        run: php artisan dusk

      - name: Check Code Coverage Threshold
        run: php scripts/check-coverage.php

      - name: Check Skill Triads Inventory
        run: php scripts/check-skills.php

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clover-coverage
          path: storage/coverage/clover.xml
          retention-days: 14
