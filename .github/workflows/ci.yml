name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, dom, curl, zip
          coverage: xdebug

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Build frontend assets
        run: npm ci && npm run build

      - name: Setup environment
        run: |
          cp .env.ci .env
          php artisan key:generate

      - name: Setup Dusk Chrome Driver
        run: php artisan dusk:chrome-driver --detect

      - name: Start Laravel Application Server
        run: php artisan serve --port=8000 &

      - name: Run Unit and Feature Tests with Coverage
        run: php artisan test --testsuite=Unit,Feature --coverage-clover=storage/coverage/clover.xml

      - name: Run Dusk Browser Tests
        run: php artisan dusk

      - name: Check Code Coverage Threshold
        run: php scripts/check-coverage.php

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clover-coverage
          path: storage/coverage/clover.xml
          retention-days: 14
